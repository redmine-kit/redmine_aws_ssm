# Publishes the plugin as a gem to GitHub Packages
# (https://rubygems.pkg.github.com/redmine-kit) when a version tag v* is
# pushed. The tag must equal the version in the gemspec and init.rb.
# Installing from GitHub Packages needs a token with read:packages, even for
# a public package (docs/setup.md#installation).
name: Gem

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Ruby 4.0 image, pinned in test/ruby-4.0.Dockerfile (Dependabot
  # updates it there), for the container of the gem job.
  image:
    runs-on: ubuntu-24.04
    outputs:
      ruby: ${{ steps.ruby.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: ruby
        run: echo "image=$(sed -n 's/^FROM //p' test/ruby-4.0.Dockerfile)" >> "$GITHUB_OUTPUT"

  gem:
    needs: image
    runs-on: ubuntu-24.04
    container: ${{ needs.image.outputs.ruby }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check the version
        run: |
          version=$(ruby -e 'print Gem::Specification.load("redmine_aws_ssm.gemspec").version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "the tag $GITHUB_REF_NAME is not v$version" >&2; exit 1; }
          if [ -f init.rb ]; then grep -q "version '$version'" init.rb || { echo "init.rb is not $version" >&2; exit 1; }; fi
          echo "version=$version" >> "$GITHUB_ENV"
      - run: gem build redmine_aws_ssm.gemspec
      - name: Push to GitHub Packages
        env:
          TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$HOME/.gem"
          printf -- '---\n:github: Bearer %s\n' "$TOKEN" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          gem push --key github --host https://rubygems.pkg.github.com/redmine-kit "redmine_aws_ssm-$version.gem"
