name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The Rubies of Redmine 7.0 (3.2 to 4.0). The scripts' own Ruby is 4.0.
        include:
          - ruby: "3.2"
            image: ruby:3.2@sha256:d3bcbd845d26ae1efafcc987f641aa9ac796267b9b857e0f196a2b05070c8330
          - ruby: "4.0"
    env:
      RUBY_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bin/lint

  test:
    needs: static
    name: test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            image: ruby:3.2@sha256:d3bcbd845d26ae1efafcc987f641aa9ac796267b9b857e0f196a2b05070c8330
          - ruby: "4.0"
    env:
      RUBY_IMAGE: ${{ matrix.image }}
    permissions:
      contents: read
      id-token: write # Codecov with OIDC, no token stored
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # redmine_aws, whose inflections boot/ loads, until the tests install
      # its gem.
      - uses: actions/checkout@v7.0.1
        with:
          repository: redmine-kit/redmine_aws
          path: redmine_aws
          persist-credentials: false
      # LocalStack when the organization's token is available, moto otherwise
      # (pull requests from forks); bin/test prints which one ran.
      - run: bin/test
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          REDMINE_AWS_DIR: redmine_aws
      # Not failing the run while the Codecov GitHub App is not installed.
      - if: matrix.ruby == '4.0'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/coverage.xml
          use_oidc: true
          fail_ci_if_error: false
      - if: always()
        run: bin/test --down
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
