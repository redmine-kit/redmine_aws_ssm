# AWS for the tests (bin/test): moto, or LocalStack when an auth token is
# given, both reproducing the SSM API. No ports are published; the tests
# reach them on the network.
name: redmine-serverless-ssm-test
services:
  moto:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 2s
      retries: 30

  # LocalStack (Hobby) needs an auth token, so it starts only with the
  # "localstack" profile, which bin/test turns on when LOCALSTACK_AUTH_TOKEN
  # is set. The token is never written to the repository.
  localstack:
    image: localstack/localstack:2026.10.6@sha256:f94401988db4c01a5b2634d37d698a9b11c93f74c1ad0f7a8849f5ebd73dcbdc
    profiles: ["localstack"]
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: ssm
    # The image has its own health check.
