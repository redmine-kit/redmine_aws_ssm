# AWS for the tests (bin/test): SSM on AWS Emulator
# (test/aws-emulator/Dockerfile). No host ports. The emulator is only on the
# internal network, which cannot reach AWS, and the tests run in its network
# namespace (test/network_test.rb fails if they can reach AWS). Its
# certificate names only 127.0.0.1 and localhost, so the tests reach it on
# https://127.0.0.1:9297 and trust the certificate it writes to the volume at
# each start (AWS_CA_BUNDLE, bin/test). Authentication is off: the tests sign
# with fixed keys.
name: redmine-aws-ssm-test
networks:
  internal:
    internal: true

services:
  aws-emulator:
    build: aws-emulator
    image: redmine-aws-ssm-test-aws-emulator
    pull_policy: build
    command: ["--auth", "off"]
    networks: [internal]
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - aws-emulator:/home/emulator/.aws/emulator
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://127.0.0.1:9297/__admin/health"]
      interval: 1s
      retries: 30

volumes:
  aws-emulator:
